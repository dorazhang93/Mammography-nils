seed: 42
data:
  input_size: 256
  work_size: 512
  cache_dir: ~/.cache/mammo_qc_cache
  extensions:
  - .dcm
  - .dicom
  - .png
  - .npz
  - .npy
  npz_key: null
  dicom_background_to_zero: true
  source_patterns:
    KARMA: (?i)karma
    OMIDB: (?i)omidb
    CSAW-CC: (?i)csaw
    Screen-point: (?i)screen.?point
  default_source: Lund-Malmo
model:
  backbone: efficientnet_b0
  pretrained: true
  pretrained_file: null
  dropout: 0.3
augment:
  enabled: true
  hflip_p: 0.5
  gamma_p: 0.5
  gamma_range:
  - 0.7
  - 1.3
  contrast_p: 0.5
  contrast_range:
  - 0.8
  - 1.2
  brightness_p: 0.5
  brightness_range:
  - -0.1
  - 0.1
  breast_threshold: 0.02
synthetic:
  enabled: true
  stripes:
    p: 0.15
    n_range:
    - 1
    - 6
    width_range:
    - 2
    - 12
    delta_range:
    - 0.03
    - 0.25
    vertical_p: 0.7
    periodic_p: 0.3
    period_range:
    - 8
    - 48
    periodic_width_range:
    - 2
    - 4
    breast_only_p: 0.5
  scanned_film:
    p: 0.15
    blur_sigma_range:
    - 0.8
    - 2.5
    tone_k_range:
    - 4.0
    - 10.0
    grain_amp_range:
    - 0.01
    - 0.04
    grain_sigma_range:
    - 0.5
    - 1.5
    levels_range:
    - 64
    - 256
  partial_crop:
    p: 0.15
    keep_range_w:
    - 0.45
    - 0.8
    keep_range_h:
    - 0.35
    - 0.6
    min_removed: 0.3
    min_remaining: 0.3
    attempts: 20
train:
  batch_size: 32
  num_workers: 8
  max_epochs: 200
  min_epochs: 20
  warmup_epochs: 5
  optimizer: adamw
  lr_pretrained: 0.0001
  lr_scratch: 0.001
  min_lr_ratio: 0.01
  weight_decay: 0.01
  convergence_patience: 10
  convergence_rel_tol: 0.01
  amp: true
  channels_last: true
uncertainty:
  train_percentile: 5.0
infer:
  batch_size: 64
  num_workers: 8
